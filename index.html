<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pacific Rhythm — Gamedev.js Jam 2026</title>
    <!--
      Title-screen typeface. We use preconnect + display=swap so the
      fallback (Impact / Arial Black) paints immediately, then upgrades
      to Dela Gothic One once the Google Font arrives. TitleScene
      listens on document.fonts.ready to force a canvas re-rasterise
      once the real face lands.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* Phaser injects a canvas into #app; display:block removes the inline
         baseline whitespace, and the max-* rules keep FIT-mode letterboxing
         from ever overflowing the host viewport. */
      #app canvas {
        display: block;
        margin: 0;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
